<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote Pen</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/addquote.css">
  <link rel="stylesheet" href="../css/quote.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>
<body>
  <nav>
    <div class="logo">
      <a href="../html/index.html">QuotePen</a>
    </div>
    <div class="hamburger" onclick="toggleMenu()"> 
      <span></span>
      <span></span>
      <span></span>
    </div>
    <ul class="nav-links" id="navLinks">
      <li><a href="../html/addquote.html">Add-Quote</a></li>
      <li><a href="../html/topquote.html">Top-Quote</a></li>
      <li><a href="../html/browsequote.html">Browse-Quote</a></li>
       <li><a href="contact.html">Contact</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
      <header>
        <h1>Quote Collection</h1>
        <nav>
            <button id="viewQuotesBtn">View Quotes</button>
            <button id="addQuoteBtn">Add Quote</button>
        </nav>
    </header>
    <main>
        <!-- Quotes View -->
        <section id="quotesView" class="active-view">
            <div class="filter-buttons">
                <button class="filter-btn active" data-category="all">All Quotes</button>
                <button class="filter-btn" data-category="motivational">Motivational</button>
                <button class="filter-btn" data-category="inspirational">Inspirational</button>
                <button class="filter-btn" data-category="nature">Nature</button>
                <button class="filter-btn" data-category="life">Life</button>
                <button class="filter-btn" data-category="wisdom">Wisdom</button>
            </div>
            
            <div class="quotes-container" id="quotesContainer"></div>
        </section>

        <!-- Add Quote Form -->
        <section id="addQuoteView">
            <h2>Add Your Quote</h2>
            <form id="quoteForm">
                <div class="form-group">
                    <label for="quoteText">Quote Text*</label>
                    <textarea id="quoteText" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="quoteAuthor">Author*</label>
                    <input type="text" id="quoteAuthor" required>
                </div>
                
                <div class="form-group">
                    <label for="quoteCategory">Category*</label>
                    <select id="quoteCategory" required>
                        <option value="">Select a category</option>
                        <option value="motivational">Motivational</option>
                        <option value="inspirational">Inspirational</option>
                        <option value="nature">Nature</option>
                        <option value="life">Life</option>
                        <option value="wisdom">Wisdom</option>
                    </select>
                </div>
                
                <button type="submit">Submit Quote</button>
            </form>
        </section>
    </main>
    </body>
    </html>
